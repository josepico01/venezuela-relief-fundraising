<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Papelón Melbourne Arepa Fundraiser</title>
    
    <!-- 🚀 Bulletproof Tailwind CDN: This bypasses all CSS compiler bugs instantly -->

    <script>
      tailwind.config = {
        theme: {
          extend: {
            animation: {
              'spin-slow': 'spin 12s linear infinite',
              'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-neutral-900 text-white selection:bg-yellow-500 selection:text-black">

    <script type="module" src="/src/main.jsx"></script>
